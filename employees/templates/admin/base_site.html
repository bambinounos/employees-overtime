{% extends "admin/base.html" %}
{% load static %}

{% block branding %}
<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;width:100%;">
    <h1 id="site-name" style="margin:0;">
        <a href="{% url 'admin:index' %}">
            Salary Management Administration
        </a>
        {% if app_version %}<span style="display:inline-block;margin-left:8px;padding:2px 8px;background:rgba(255,255,255,0.18);border-radius:4px;font-size:0.7rem;font-weight:normal;vertical-align:middle;letter-spacing:0.5px;">v{{ app_version }}</span>{% endif %}
    </h1>
    <a href="{% url 'strategic_dashboard' %}" style="display:inline-block;padding:5px 10px;background:rgba(255,255,255,0.16);color:#fff;border-radius:4px;font-size:0.8rem;text-decoration:none;font-weight:600;">
        &larr; Dashboard
    </a>
</div>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% if site_config.favicon %}
    <link rel="icon" href="{{ site_config.favicon.url }}">
{% else %}
    <link rel="icon" type="image/x-icon" href="{% static 'employees/img/favicon.ico' %}">
{% endif %}
<style>
    /* Mejoras responsivas integrales para Django Admin en móviles y tablets */
    *, *::before, *::after {
        box-sizing: border-box;
    }
    #changelist .results,
    .inline-group .tabular {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        max-width: 100%;
    }
    @media (max-width: 1024px) {
        #header {
            padding: 10px 14px !important;
            height: auto !important;
            flex-direction: column;
            align-items: flex-start !important;
            gap: 6px;
        }
        #site-name {
            font-size: 1.1rem !important;
            line-height: 1.3 !important;
        }
        #user-tools {
            margin: 0 !important;
            padding: 0 !important;
            font-size: 0.78rem !important;
            text-align: left !important;
            line-height: 1.5 !important;
        }
        #content {
            padding: 12px !important;
        }
        .breadcrumbs {
            padding: 8px 12px !important;
            font-size: 0.82rem !important;
            overflow-x: auto;
            white-space: nowrap;
        }
    }
    @media (max-width: 767px) {
        /* Formularios y campos a ancho completo en móvil */
        .form-row,
        .aligned .form-row,
        .aligned .form-row > div {
            display: block !important;
            width: 100% !important;
            padding: 8px 0 !important;
        }
        .aligned label {
            display: block !important;
            width: 100% !important;
            padding: 0 0 4px 0 !important;
            font-weight: 600;
        }
        .form-row input[type="text"],
        .form-row input[type="password"],
        .form-row input[type="email"],
        .form-row input[type="url"],
        .form-row input[type="number"],
        .form-row input[type="date"],
        .form-row input[type="time"],
        .form-row select,
        .form-row textarea,
        .vTextField,
        .vLargeTextField,
        .vURLField,
        .vIntegerField,
        .select2-container {
            width: 100% !important;
            max-width: 100% !important;
            min-height: 38px;
        }
        .related-widget-wrapper {
            width: 100% !important;
            display: flex !important;
            flex-wrap: wrap;
            align-items: center;
            gap: 4px;
        }
        .related-widget-wrapper select,
        .related-widget-wrapper .select2-container {
            flex: 1 1 calc(100% - 90px) !important;
            min-width: 180px;
        }
        /* Widget filter_horizontal (ej. KPIs en JobProfile) apilado verticalmente */
        .selector {
            width: 100% !important;
            display: flex !important;
            flex-direction: column !important;
            gap: 10px;
        }
        .selector .selector-available,
        .selector .selector-chosen {
            width: 100% !important;
            float: none !important;
        }
        .selector select {
            width: 100% !important;
            max-height: 200px;
        }
        .selector ul.selector-chooser {
            transform: rotate(90deg);
            margin: 4px auto !important;
        }
        /* Acciones y barra de búsqueda en changelist */
        #changelist #toolbar form input[type="text"] {
            width: 100% !important;
            margin-bottom: 6px;
        }
        #changelist .actions {
            display: flex !important;
            flex-wrap: wrap;
            gap: 6px;
            padding: 8px !important;
        }
        #changelist .actions label,
        #changelist .actions select {
            width: 100% !important;
        }
        /* Botonera inferior de guardado */
        .submit-row {
            display: flex !important;
            flex-direction: column !important;
            gap: 8px;
            padding: 10px !important;
        }
        .submit-row input,
        .submit-row a.deletelink,
        .submit-row a.closelink {
            width: 100% !important;
            margin: 0 !important;
            text-align: center !important;
            min-height: 42px;
        }
        /* Tablas de resultados con scroll táctil */
        #result_list th,
        #result_list td {
            white-space: nowrap;
            padding: 8px 10px !important;
            font-size: 0.82rem !important;
        }
        p.datetime {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
    }
</style>
{% endblock %}
